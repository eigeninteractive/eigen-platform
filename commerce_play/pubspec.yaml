name: eigen_commerce_play
description: Optional Google Play Billing storefront for EigenInteractive Flutter apps, implementing the eigen_flutter PurchaseGateway port.
version: 0.1.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/commerce_play
documentation: https://eigeninteractive.com/docs/build-a-game/monetization
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/tree/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_commerce_play-v%version%

# Resolved as part of the workspace at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_flutter: ^0.10.0
  in_app_purchase: ^3.3.0
  # Directly, and not only through `in_app_purchase`, because settling a
  # purchase from durable evidence after a restart means constructing a
  # `GooglePlayPurchaseDetails` rather than holding one in memory.
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
