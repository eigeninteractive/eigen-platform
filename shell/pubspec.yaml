name: eigen_shell
description: The complete first-party Flutter application shell for EigenInteractive turn-based games.
version: 0.1.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/shell
documentation: https://eigeninteractive.com/docs/reference/dart
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/releases/tag/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_shell-v%version%

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  eigen_flutter: ^0.9.0
  eigen_client: ^0.1.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  share_plus: ^13.1.0
  flutter_native_splash: ^2.4.7
  in_app_update: ^5.0.0
  in_app_review: ^2.0.11
  app_settings: ">=8.0.3 <10.0.0"
  url_launcher: ^6.3.2
  web: ^1.1.1
  package_info_plus: ^10.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  checks: ^0.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  shared_preferences: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/vendor/cropperjs/
    - assets/google/
