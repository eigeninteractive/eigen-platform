name: eigen_commerce_hosted
description: Optional hosted-checkout storefronts for EigenInteractive Flutter apps — Stripe and Razorpay — implementing the eigen_flutter HostedStorefront port.
version: 0.1.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/commerce_hosted
documentation: https://eigeninteractive.com/docs/build-a-game/monetization
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/tree/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_commerce_hosted-v%version%

# Resolved as part of the workspace at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_flutter: ^0.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
