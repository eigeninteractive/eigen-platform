name: eigen_flutter
description: "EigenInteractive Flutter client: the whitelabel app half for turn-based multiplayer games on the EigenInteractive server."
version: 0.9.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/flutter
documentation: https://eigeninteractive.com/docs/reference/dart
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

# `cider` keeps CHANGELOG.md and the version above in step, Keep-a-Changelog
# style. Add entries as you work (`cider log added "…"`), then at release time
# `cider bump minor && cider release` moves everything under `## [Unreleased]`
# into a dated, linked section and bumps the version here.
cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/releases/tag/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_flutter-v%version%

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_client: ^0.1.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  riverpod_sqflite: ^0.4.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  # The generated REST client. It is produced and published by the ENGINE repo
  # (eigen-server/clients/dart), because that is where the wire contract lives:
  # so its version is the engine's, and this constraint is the compatibility
  # statement: `^0.1.0` means "any engine that has not broken the wire".
  #
  # Pre-1.0 that resolves to `>=0.1.0 <0.2.0`: the engine announces breakage in
  # the MINOR position, so 0.2.0 is the release that needs a deliberate bump
  # here. See https://eigeninteractive.com/docs/reference/compatibility.
  eigen_api: ^0.6.0
  dio: ^5.10.0
  dio_smart_retry: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  json_serializable: ^6.13.0
  # Generated sources are committed, so the generator itself is an exact build
  # input. 3.2.6-dev.1 is the analyzer-12 release compatible with our minimum
  # supported Flutter SDK (see .fvmrc); a range lets newer SDKs silently select
  # the analyzer-13/Freezed-4 generator and produce different source.
  freezed: 3.2.6-dev.1
  checks: ^0.3.1
  eigen_codegen: ^0.1.0

flutter:
  uses-material-design: true

  assets:
    - fonts/OFL-Inter.txt
    - fonts/OFL-SpaceGrotesk.txt

  # Both faces are bundled as package fonts, so a consuming app gets them
  # automatically and they render offline from the first frame with no runtime
  # fetch. Space Grotesk carries the display and headline roles; Inter carries
  # everything a player reads at length. See lib/core/theme/app_theme.dart.
  #
  # One variable file each, with no per-weight entries. Flutter's FontWeight now
  # drives the `wght` axis directly (landed in 3.41; this package requires
  # 3.44), so a single file covers every weight and intermediate weights become
  # available for free. Declaring `weight:` here would put Flutter back into
  # file-matching and defeat that. Inter also has an `opsz` axis, which nothing
  # sets: it rests at its default of 14, the text optical size, which is the
  # right one for the roles Inter has.
  #
  # Licences ship beside the files, as OFL-1.1 requires.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-Variable.ttf
