name: rps_example
description: "Rock-Paper-Scissors: the reference game implementation for the EigenInteractive Flutter client."
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_flutter:
    path: ../
  eigen_firebase:
    path: ../../firebase
  # Generated Firebase options and the background isolate use Firebase Core
  # directly, so the app declares it in addition to the adapter package.
  firebase_core: ^4.9.0

dev_dependencies:
  eigen_codegen: ^0.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Widget-testing a game screen means supplying the `AppConfig` the shared
  # widgets read, which needs a `ProviderScope`. `runEngineApp` installs one in
  # a real app, so this is a test-only dependency.
  flutter_riverpod: ^3.3.2

flutter:
  uses-material-design: true
