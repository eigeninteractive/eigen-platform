# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary, `esbuild` and `sharp`
# (via miniflare) download/build native bindings. Without these, pnpm 11+
# aborts the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@swc/core': true
  core-js: true
  # Docusaurus' dev-server file watcher (native binding; falls back to
  # polling without it) and the code-sample generator behind the OpenAPI
  # theme's per-language request snippets.
  '@parcel/watcher': true
  postman-code-generators: true
