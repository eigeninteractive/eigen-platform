name: Platform checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # The pull request run gates merge. The main run verifies the exact merged
  # commit and is the release coordinator's trusted publication boundary.
  push:
    branches: [main]

concurrency:
  # Superseding an in-flight run is useful on a branch that moves quickly.
  # Release publication listens for the successful main run.
  group: platform-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A narrow documentation-only fast lane keeps ordinary docs iteration
      # quick on pull requests and their merged main commits. Tags, reusable
      # callers, missing baselines, and every unknown path fail closed to the
      # complete platform gate.
      - name: Classify the change scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          # Changesets' generated PR contains only deterministic release
          # metadata from an already-checked main commit. Its merged main
          # commit receives the complete gate before publication, so running
          # every shard on this intermediate PR adds no release safety.
          if [ "$EVENT_NAME" = "pull_request" ] \
             && [ "$HEAD_REF" = "changeset-release/main" ]; then
            full=false
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]] \
               && [ -n "$BASE_SHA" ] \
               && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
            if [ "${#changed[@]}" -gt 0 ]; then
              full=false
              for path in "${changed[@]}"; do
                case "$path" in
                  web/*|docs/*|LICENSE) ;;
                  *.md)
                    if [[ "$path" == */* ]]; then
                      full=true
                      break
                    fi
                    ;;
                  *) full=true; break ;;
                esac
              done
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  manifest:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc

      - name: Check the platform manifest
        run: ./tool/check.sh manifest

  server:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.full == 'true'
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.full == 'true'
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - uses: actions/setup-java@v6.0.0
        if: needs.scope.outputs.full == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1
        if: needs.scope.outputs.full == 'true'
        with:
          sdk: stable

      - name: Install server dependencies
        if: needs.scope.outputs.full == 'true'
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check server packages and generated API
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh server

      - name: Scoped change
        if: needs.scope.outputs.full != 'true'
        run: echo "Server checks are not needed for this scoped change."

  flutter:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'

      - uses: subosito/flutter-action@v2
        if: needs.scope.outputs.full == 'true'
        with:
          flutter-version-file: flutter/.fvmrc
          channel: stable
          cache: true

      - name: Check the Flutter package and example
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh flutter

      - name: Scoped change
        if: needs.scope.outputs.full != 'true'
        run: echo "Flutter sources are unchanged."

  web:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check implementor documentation
        run: ./tool/check.sh web

  scaffold:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [android, web]
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.full == 'true'
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.full == 'true'
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - uses: subosito/flutter-action@v2
        if: needs.scope.outputs.full == 'true'
        with:
          flutter-version-file: flutter/.fvmrc
          channel: stable
          cache: true

      - uses: actions/setup-java@v6.0.0
        if: needs.scope.outputs.full == 'true' && matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            flutter/.fvmrc
            flutter/pubspec.lock
            server/packages/create-eigen-game/templates/app-overlay/android/**

      - name: Install server dependencies
        if: needs.scope.outputs.full == 'true'
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check a newly scaffolded game
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh scaffold "${{ matrix.target }}"

      - name: Scoped change
        if: needs.scope.outputs.full != 'true'
        run: echo "Scaffold sources are unchanged."

  # Keep this stable job name. It is the single status required by the `main`
  # ruleset, while the expensive work above is free to run in parallel. See
  # docs/operations/rulesets.md.
  check:
    name: check
    if: always()
    needs: [scope, manifest, server, flutter, web, scaffold]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform shard
        if: >-
          needs.manifest.result != 'success' ||
          needs.server.result != 'success' ||
          needs.flutter.result != 'success' ||
          needs.web.result != 'success' ||
          needs.scaffold.result != 'success'
        run: |
          echo "::error::One or more platform check shards did not succeed."
          exit 1

      - name: Platform checks passed
        run: echo "Every platform check shard succeeded."
