name: Platform checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # `main` currently accepts direct pushes, so it needs its own advisory run:
  # without one, a commit that never opened a pull request would receive no
  # platform check at all until a release gate happened to run.
  push:
    branches: [main]
  workflow_call:

concurrency:
  # Superseding an in-flight advisory run is the point on a branch that moves
  # quickly. Package tag workflows still call this gate under their own
  # top-level workflow name and therefore have an independent concurrency key.
  group: platform-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A narrow documentation-only fast lane keeps ordinary docs iteration
      # quick on pull requests and direct main pushes. Tags, reusable callers,
      # missing baselines, and every unknown path fail closed to the complete
      # platform gate.
      - name: Classify the change scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]] \
               && [ -n "$BASE_SHA" ] \
               && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
            if [ "${#changed[@]}" -gt 0 ]; then
              full=false
              for path in "${changed[@]}"; do
                case "$path" in
                  web/*|docs/*|LICENSE) ;;
                  *.md)
                    if [[ "$path" == */* ]]; then
                      full=true
                      break
                    fi
                    ;;
                  *) full=true; break ;;
                esac
              done
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  manifest:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc

      - name: Check the platform manifest
        run: ./tool/check.sh manifest

  server:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.full == 'true'
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.full == 'true'
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - uses: actions/setup-java@v5.7.0
        if: needs.scope.outputs.full == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1
        if: needs.scope.outputs.full == 'true'
        with:
          sdk: stable

      - name: Install server dependencies
        if: needs.scope.outputs.full == 'true'
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check server packages and generated API
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh server

      # A published npm package can otherwise change without ever entering the
      # Changesets release queue. The version PR consumes its changesets, so it
      # is the one intentional exception.
      - name: Published npm changes have release notes
        if: needs.scope.outputs.full == 'true' && github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        working-directory: server
        run: |
          pnpm changeset status --since=origin/main || {
            echo "::error::A published npm package changed without a changeset. Run 'pnpm changeset', or 'pnpm changeset --empty' for a non-release change."
            exit 1
          }

      # The same rule for a direct push, which opens no pull request and therefore
      # never reached the step above. That gap is not theoretical: while `main` has
      # been accepting direct pushes, create-eigen-game accumulated four
      # user-visible template changes with no changeset and came within one commit
      # of sitting out the 0.5.0 release, which would have left npm serving
      # templates typechecked against an engine line that no longer exists.
      - name: Published npm changes have release notes (direct push)
        if: needs.scope.outputs.full == 'true' && github.event_name == 'push'
        working-directory: server
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::This push has no reachable baseline commit, so there is no range to judge."
            exit 0
          fi

          # The version commit is the one intentional exception, exactly as the
          # `changeset-release/main` branch is for the step above: it consumes the
          # entire queue and bumps the versions in the same commit, so an empty
          # queue is the correct state rather than a missing changeset. Detected by
          # the bump itself and not by a branch name or commit subject, because
          # `changeset version` is the only thing in this repository that rewrites
          # those version fields.
          if git diff "$BEFORE..HEAD" -- 'packages/*/package.json' | grep -qE '^\+\s*"version":'; then
            echo "::notice::This push bumped published package versions, so the release queue is expected to be empty."
            exit 0
          fi

          pnpm changeset status --since="$BEFORE" || {
            echo "::error::A published npm package changed without a changeset. Run 'pnpm changeset', or 'pnpm changeset --empty' for a non-release change."
            exit 1
          }

      - name: Documentation-only change
        if: needs.scope.outputs.full != 'true'
        run: echo "Server checks are covered by the documentation build for this scoped change."

  flutter:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'

      - uses: subosito/flutter-action@v2
        if: needs.scope.outputs.full == 'true'
        with:
          flutter-version-file: flutter/.fvmrc
          channel: stable
          cache: true

      - name: Check the Flutter package and example
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh flutter

      - name: Documentation-only change
        if: needs.scope.outputs.full != 'true'
        run: echo "Flutter sources are unchanged."

  web:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check implementor documentation
        run: ./tool/check.sh web

  scaffold:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [android, web]
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.full == 'true'

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.full == 'true'
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.full == 'true'
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - uses: subosito/flutter-action@v2
        if: needs.scope.outputs.full == 'true'
        with:
          flutter-version-file: flutter/.fvmrc
          channel: stable
          cache: true

      - uses: actions/setup-java@v5.7.0
        if: needs.scope.outputs.full == 'true' && matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            flutter/.fvmrc
            flutter/pubspec.lock
            server/packages/create-eigen-game/templates/app-overlay/android/**

      - name: Install server dependencies
        if: needs.scope.outputs.full == 'true'
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check a newly scaffolded game
        if: needs.scope.outputs.full == 'true'
        run: ./tool/check.sh scaffold "${{ matrix.target }}"

      - name: Documentation-only change
        if: needs.scope.outputs.full != 'true'
        run: echo "Scaffold sources are unchanged."

  # Keep this stable job name. It is the single status a future `main` branch
  # protection re-enables as its required check, while the expensive work above
  # is free to run in parallel. See docs/operations/branch-protection.md.
  check:
    name: check
    if: always()
    needs: [scope, manifest, server, flutter, web, scaffold]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform shard
        if: >-
          needs.manifest.result != 'success' ||
          needs.server.result != 'success' ||
          needs.flutter.result != 'success' ||
          needs.web.result != 'success' ||
          needs.scaffold.result != 'success'
        run: |
          echo "::error::One or more platform check shards did not succeed."
          exit 1

      - name: Platform checks passed
        run: echo "Every platform check shard succeeded."

  # The exact green main commit is the npm release gate. release.yml also runs
  # directly on pushes to maintain the Changesets version PR; this callback is
  # its separate publish mode and does not open or update that PR again.
  release:
    name: npm release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/release.yml
    with:
      after_checks: true
    secrets: inherit
    permissions:
      contents: write
      id-token: write
