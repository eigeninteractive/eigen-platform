name: Publish eigen_codegen

on:
  push:
    tags: ["eigen_codegen-v*"]

concurrency:
  group: publish-eigen-codegen
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dart/eigen_codegen
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Verify tag and package version
        run: |
          tag="${GITHUB_REF_NAME#eigen_codegen-v}"
          package=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          [ "$tag" = "$package" ] || {
            echo "::error::tag eigen_codegen-v$tag does not match pubspec version $package"
            exit 1
          }

      - name: Check whether the version is already published
        id: published
        run: |
          v=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          if curl -sf --retry 3 https://pub.dev/api/packages/eigen_codegen \
               | jq -e --arg v "$v" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::eigen_codegen $v is already published."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Dart generator
        if: steps.published.outputs.skip == 'false'
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Publish dry run
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --dry-run

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --force
