name: Version Dart packages

# Versions the five hand-written Dart packages in one pass.
#
# They were released one at a time until this workflow changed, and the cost of
# that was not the five dispatches -- it was that a package's consumers name it
# by a caret range, and pre-1.0 a feature release moves the MINOR, so every
# release invalidated every consumer's pin. Those pins could only be raised
# AFTER the dependency published, which forced the chain to be serial: publish,
# raise pins, publish, raise pins, once per level of a four-deep graph. The
# offline-play release cost three hand-written pull requests to exactly that.
#
# Melos removes the arithmetic rather than automating it. `--dependent-constraints`
# rewrites the ranges these packages name each other by, in the same commit that
# versions them, so the pins never lag a publish. `--dependent-versions` then
# gives a patch release to anything whose only change was one of those ranges.
#
# Melos owns versions and constraints only. Changelogs stay with cider, because
# they are curated prose rather than generated commit subjects. Tags and
# publication stay with `tag-dart-packages.yml` and `publish-dart.yml`, because
# pub.dev only accepts an automated publish from a tag-triggered run -- it
# validates the repository, the tag against each package's configured pattern,
# and the `pub.dev` environment, not which file published.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How far to raise the packages that have changelog entries
        required: true
        type: choice
        options: [patch, minor, breaking]

concurrency:
  group: version-dart-packages
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Install cider and melos
        run: |
          dart pub global activate cider
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Verify release starting point
        run: |
          # Every package must already be published at the version it currently
          # names. Bumping on top of a version that never shipped would strand
          # it: the tag exists, pub.dev does not have it, and the next release
          # silently skips past the gap.
          for entry in \
            "eigen_client:dart/eigen_client" \
            "eigen_codegen:dart/eigen_codegen" \
            "eigen_flutter:flutter" \
            "eigen_shell:shell" \
            "eigen_firebase:firebase"; do
            IFS=: read -r package path <<<"$entry"
            current=$(cider --project-root="$path" version)
            published=$(curl -sf --retry 3 "https://pub.dev/api/packages/$package") || {
              echo "::error::could not query pub.dev for $package"
              exit 1
            }
            jq -e --arg version "$current" \
              '.versions[] | select(.version == $version)' >/dev/null <<<"$published" || {
              echo "::error::$package $current is not published; recover that release before bumping again"
              exit 1
            }
          done

          # At least one package must have something to say. The others may
          # legitimately have nothing -- they come along only if they depend on
          # one that does -- but a release where NOTHING changed is a mistake.
          described=0
          for path in dart/eigen_client dart/eigen_codegen flutter shell firebase; do
            changes=$(cider --project-root="$path" describe --only-body 2>/dev/null || true)
            [ -n "$(tr -d '[:space:]' <<<"$changes")" ] && described=1
          done
          [ "$described" = "1" ] || {
            echo "::error::no Dart package has Unreleased changelog entries"
            exit 1
          }

      - name: Version the packages and close their changelogs
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Melos and cider disagree about 0.x, so the mapping is explicit.
          # On 0.2.0, cider gives patch 0.2.1, minor 0.3.0, breaking 0.3.0;
          # melos gives patch 0.2.1, minor 0.2.1, major 0.3.0. Melos shifts
          # every name down one position below 1.0, cider does not. This mapping
          # reproduces exactly what this workflow did when cider owned the bump.
          #
          # `minor` and `breaking` coincide here, and that is not a mistake:
          # pre-1.0 the breaking change IS the minor bump, which is what
          # `^0.2.0` resolving to `>=0.2.0 <0.3.0` means. They separate at 1.0,
          # and this mapping needs revisiting then.
          case "$BUMP" in
            patch) melos_bump=patch ;;
            minor|breaking) melos_bump=major ;;
            *) echo "::error::unknown bump: $BUMP"; exit 64 ;;
          esac

          packages="eigen_client:dart/eigen_client eigen_codegen:dart/eigen_codegen"
          packages="$packages eigen_flutter:flutter eigen_shell:shell eigen_firebase:firebase"

          # Only packages with something to release are named. The rest are left
          # to `--dependent-versions`, which patch-bumps whatever depended on
          # them -- the honest version for a package whose only change is the
          # constraint it names a sibling by.
          # Versions before, recorded to a file rather than an associative
          # array: those need bash 4, and this script should stay runnable on a
          # developer's macOS bash 3.2 as well as on the runner.
          before="$RUNNER_TEMP/versions-before"
          : > "$before"
          args=()
          for entry in $packages; do
            IFS=: read -r package path <<<"$entry"
            echo "$package $(cider --project-root="$path" version)" >> "$before"
            changes=$(cider --project-root="$path" describe --only-body 2>/dev/null || true)
            [ -n "$(tr -d '[:space:]' <<<"$changes")" ] && args+=(--manual-version="$package:$melos_bump")
          done

          # `--dependent-constraints` is on by default and is the point of
          # running melos: it rewrites the caret ranges these packages name each
          # other by, in this same commit. `eigen_api` is never named, so its
          # version and the ranges pointing at it are left alone -- the npm
          # release owns those.
          melos version "${args[@]}" --no-changelog --no-git-commit-version --yes

          released=""
          for entry in $packages; do
            IFS=: read -r package path <<<"$entry"
            was=$(awk -v p="$package" '$1 == p { print $2 }' "$before")
            now=$(cider --project-root="$path" version)
            [ "$now" = "$was" ] && continue
            # A package melos moved only because a sibling did still needs a
            # changelog section, and saying so is better than a bodyless
            # heading. This is what Changesets writes on the npm side.
            changes=$(cider --project-root="$path" describe --only-body 2>/dev/null || true)
            if [ -z "$(tr -d '[:space:]' <<<"$changes")" ]; then
              cider --project-root="$path" log changed \
                "Require the release of its sibling packages in this version."
            fi
            cider --project-root="$path" release
            released="$released $package $now"
            echo "::notice::$package $was -> $now"
          done

          [ -n "$released" ] || {
            echo "::error::melos versioned nothing"
            exit 1
          }

          node tool/check-dart-releases.mjs
          {
            echo "released<<EOF"
            for pair in $released; do printf '%s ' "$pair"; done
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUMP: ${{ inputs.bump }}
          RELEASED: ${{ steps.bump.outputs.released }}
        run: |
          # One branch, refreshed, rather than one per version: these packages
          # release together and their versions differ, so there is no single
          # number to name it after.
          branch="release/dart-packages"
          lines=$(echo "$RELEASED" | xargs -n2 printf -- '- `%s` v%s\n')

          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "Release Dart packages"
          git push --force-with-lease -u origin "$branch"

          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Raises the Dart packages that had \`## [Unreleased]\` entries by \`$BUMP\`, and anything that depends on them by a patch. Melos rewrote the constraints between them in this same commit, so no follow-up pin change is needed." \
            "$lines" \
            "After the merged \`main\` commit passes the platform gate, the namespaced tags publish through pub.dev trusted publishing.")

          state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo NONE)
          if [ "$state" != "OPEN" ]; then
            gh pr create --base main --title "Release Dart packages" --body "$body"
          else
            gh pr edit "$branch" --body "$body"
            echo "Refreshed the existing release pull request."
          fi
