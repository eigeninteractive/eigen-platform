name: Sync API reference

# The generated API reference is *derived* from eigen-server and committed here,
# so it has to be refreshed when the engine's public surface changes.
#
# This opens a PULL REQUEST and turns on auto-merge; it does not push to `main`.
# Generated output therefore lands the same way authored prose does — through
# the gate in `checks.yml` — and `main` needs no bypass for automation. Nobody
# has to review a TypeDoc diff: auto-merge lands it the moment checks pass, so
# the human cost is zero while the gate stays honest.
#
# It only ever runs after eigen-server actually PUBLISHED, so what lands here
# describes an engine that exists on npm.
#
# The pull request is opened with the eigen-release App token, not
# GITHUB_TOKEN. A pull request opened by GITHUB_TOKEN receives no check runs,
# and `main` requires them — the PR would sit unmergeable forever with nothing
# explaining why.
#
# Fired three ways:
#   - `repository_dispatch` from eigen-server's `release.yml`, sent when it
#     actually PUBLISHES to npm — not on every merge to its main. This site
#     deploys continuously from its own main, so syncing per merge would put a
#     public reference online describing an engine nobody can install yet.
#   - `workflow_dispatch` from the Actions tab — the manual path, and the
#     recovery route when eigen-server's dispatch step fails after it published;
#   - weekly, as a backstop so drift can never sit unnoticed indefinitely.
on:
  repository_dispatch:
    types: [engine-api-changed]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: sync-api
  cancel-in-progress: true

# The App token below carries what this needs. GITHUB_TOKEN gets nothing.
permissions: {}

jobs:
  sync:
    name: Regenerate and open the sync pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the sync branch
          permission-pull-requests: write # open it and enable auto-merge

      # sync-api resolves the engine at `../eigen-server`, so reproduce the
      # sibling layout local development uses.
      - uses: actions/checkout@v7
        with:
          path: eigen-web
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          repository: eigeninteractive/eigen-server
          path: eigen-server
          # TypeDoc reads the checkout's HEAD SHA to build permalinks, so a
          # shallow clone is fine but the ref must be the real one.
          ref: ${{ github.event.client_payload.sha || 'main' }}
          persist-credentials: false

      # Both checkouts live in subdirectories, so there is no package.json at
      # the workspace root for the action to read `devEngines.packageManager`
      # from. Without this it fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: eigen-web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: eigen-web/.nvmrc
          cache: pnpm
          cache-dependency-path: eigen-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: eigen-web
        run: pnpm install --frozen-lockfile

      # `pnpm -r build` first, and it is not optional: the engine's workspace
      # packages resolve through their `exports` → `dist`, so `@eigeninteractive/kernel`
      # has no type declarations until it is built, and the server's own DTS
      # build fails to resolve it. This mirrors eigen-server's `checks.yml`,
      # which builds for the same reason before emitting the spec. A local run
      # hides this — `dist/` is already there from previous work.
      - name: Emit the engine's OpenAPI spec
        working-directory: eigen-server
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm --filter @eigeninteractive/server openapi

      - name: Regenerate the reference
        working-directory: eigen-web
        run: pnpm sync-api

      # Nothing to do is the common case — most engine releases do not move the
      # public surface. Exit quietly rather than opening an empty pull request.
      - name: Open the sync pull request
        working-directory: eigen-web
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.client_payload.sha || 'main' }}
        run: |
          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "Reference is already current — nothing to publish."
            exit 0
          fi

          # -C and --force so a later sync refreshes the open pull request
          # rather than failing on an existing branch.
          git switch -C sync/api-reference
          git commit -m "Sync API reference from eigen-server@${SHA}"
          git push --force -u origin sync/api-reference

          # Only an OPEN pull request is one to refresh. `gh pr view` matches by
          # branch and answers for closed and merged ones too, so testing mere
          # existence made a re-dispatch after a CLOSED sync report success and
          # create nothing — the branch updates and no pull request exists to
          # merge. Closing a bad sync and re-dispatching is the documented
          # recovery path, so that failure landed exactly when it mattered.
          state=$(gh pr view sync/api-reference --json state --jq .state 2>/dev/null || echo NONE)
          if [ "$state" = "OPEN" ]; then
            echo "Refreshed the existing sync pull request."
          else
            [ "$state" = "NONE" ] || echo "The previous sync pull request is $state — opening a new one."
            gh pr create --base main \
              --title "Sync API reference from eigen-server" \
              --body "Regenerated by \`sync-api.yml\` from eigen-server@\`${SHA}\`.

          Deterministic output of \`pnpm sync-api\` — no authored prose is touched.
          Auto-merge is on; this lands as soon as checks pass."
          fi

          # Lands it the moment the gate goes green, with no human in the loop.
          gh pr merge sync/api-reference --auto --squash
