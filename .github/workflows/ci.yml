name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Correctness only — this workflow never deploys and needs no Cloudflare
# credentials. Deploying is a deliberate `pnpm --filter <worker> deploy` from a
# machine with `wrangler login`, because it applies D1 migrations against a real
# database. Nothing here talks to the network beyond the package registry.
#
# The Workers tests run under @cloudflare/vitest-pool-workers, which boots the
# real `workerd` runtime with local D1/R2/DO simulation — no account, no
# bindings to provision, and the same runtime semantics as production. That is
# why `pnpm -r test` is the whole story and there is no separate integration job.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format + lint in one pass, in CI mode (never writes).
      - name: Biome
        run: pnpm exec biome ci .

      # Workspace packages resolve through their `exports` → `dist`, so the
      # libraries must be built before anything that consumes them can be
      # type-checked. rps depends on @eigen/server and @eigen/rules this way.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # The generated spec is the contract the Dart client is generated from, so
      # it is committed and must never lag the routes. Re-emitting it from the
      # freshly built worker and diffing catches a route or zod schema change
      # that skipped `pnpm --filter @eigen/server openapi`.
      - name: OpenAPI spec is in sync with the routes
        run: |
          pnpm --filter @eigen/server openapi
          git diff --exit-code -- packages/server/openapi.json \
            || { echo "::error file=packages/server/openapi.json::openapi.json is stale. Run 'pnpm --filter @eigen/server openapi', then regenerate the Dart client with eigen-flutter's tool/generate_api.sh, and commit both."; exit 1; }

      # Same shape of guard, higher stakes: migrations are generated from the
      # drizzle schemas and applied at deploy, so a schema edit that skipped
      # `db:generate` ships code expecting columns the database does not have.
      # Nothing else catches it — the tests run against migrations, so schema
      # and migrations drift together silently until a real deploy.
      #
      # `< /dev/null` matters: drizzle-kit prompts when a change is ambiguous
      # (a rename vs a drop+add). Without it an ambiguous change hangs the job
      # until the timeout; with it, drizzle-kit fails and you regenerate
      # locally where you can answer the prompt.
      - name: D1 and DO migrations are in sync with the schemas
        run: |
          pnpm --filter @eigen/server db:generate:d1 < /dev/null
          pnpm --filter @eigen/server db:generate:do < /dev/null
          git diff --exit-code --stat -- packages/server/migrations packages/server/src/do/migrations \
            || { echo "::error::A drizzle schema changed without a migration. Run 'pnpm --filter @eigen/server db:generate:d1' and/or ':do' and commit the result."; exit 1; }
          # A brand-new migration is an untracked file, which `git diff` alone
          # would not see.
          test -z "$(git status --porcelain -- packages/server/migrations packages/server/src/do/migrations)" \
            || { echo "::error::db:generate produced a new migration file — commit it."; git status --short -- packages/server/migrations packages/server/src/do/migrations; exit 1; }

      # worker-configuration.d.ts is generated from wrangler.jsonc bindings and
      # committed. Typecheck only catches a binding that is *used* and missing;
      # a renamed or removed binding stays green until runtime.
      - name: Worker types are in sync with wrangler.jsonc
        run: |
          pnpm --filter rps exec wrangler types < /dev/null
          git diff --exit-code -- examples/rps/worker-configuration.d.ts \
            || { echo "::error file=examples/rps/worker-configuration.d.ts::Stale worker types. Run 'wrangler types' in the worker directory and commit."; exit 1; }
