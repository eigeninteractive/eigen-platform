name: Publish eigen_api

on:
  push:
    tags: ["eigen_api-v*"]

concurrency:
  group: publish-eigen-api
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server/clients/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      # setup-dart eagerly configures the package-scoped OIDC token for the
      # whole pub.dev host. Keep dependency resolution anonymous: pub.dev can
      # legitimately reject that upload identity for unrelated dependencies.
      - name: Defer pub.dev credentials until upload
        run: dart pub token remove https://pub.dev

      - name: Verify tag and package version
        run: |
          tag="${GITHUB_REF_NAME#eigen_api-v}"
          package=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          [ "$tag" = "$package" ] || {
            echo "::error::tag eigen_api-v$tag does not match pubspec version $package"
            exit 1
          }

      - name: Check whether the version is already published
        id: published
        run: |
          v=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          if curl -sf --retry 3 https://pub.dev/api/packages/eigen_api \
               | jq -e --arg v "$v" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::eigen_api $v is already published."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check generated Dart package
        if: steps.published.outputs.skip == 'false'
        run: |
          dart pub get
          dart analyze

      - name: Publish dry run
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --dry-run

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          # The immediately preceding anonymous dry run already performed
          # validation and resolution. Avoid repeating those reads with the
          # package-scoped upload credential attached.
          dart pub publish --force --skip-validation
