name: Publish eigen_api

# Tag pushes only, and not because nothing else is convenient: pub.dev refuses
# automated publishing from a run that was not triggered by a tag push, so a
# `workflow_dispatch` here could never do anything but the dry run. Recovering
# a failed release means re-pointing the tag at a commit whose workflow works,
# because a tag-triggered run uses the workflow file AT THE TAG.
on:
  push:
    tags: ["eigen_api-v*"]

concurrency:
  group: publish-eigen-api
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server/clients/dart
    steps:
      - uses: actions/checkout@v7

      # The Flutter SDK, not the Dart SDK, because this package is a member of
      # the Dart workspace at the repository root: resolving it resolves every
      # OTHER member too, and `eigen_firebase` requires Flutter. Standalone
      # `dart pub get` fails here with "Because eigen_firebase requires the
      # Flutter SDK, version solving failed", naming a package this one does
      # not depend on and cannot see. `tool/check.sh` validates this package in
      # its Flutter shard for exactly the same reason.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter/.fvmrc
          cache: true

      - name: Verify tag and package version
        run: |
          tag="${GITHUB_REF_NAME#eigen_api-v}"
          package=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          [ "$tag" = "$package" ] || {
            echo "::error::tag eigen_api-v$tag does not match pubspec version $package"
            exit 1
          }

      - name: Check whether the version is already published
        id: published
        run: |
          v=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          if curl -sf --retry 3 https://pub.dev/api/packages/eigen_api \
               | jq -e --arg v "$v" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::eigen_api $v is already published."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check generated Dart package
        if: steps.published.outputs.skip == 'false'
        run: |
          flutter pub get
          dart analyze

      - name: Publish dry run
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --dry-run

      # `setup-dart` mints the pub.dev OIDC token itself and exports PUB_TOKEN;
      # `subosito/flutter-action` does not, so the exchange is done by hand --
      # the same way `publish-dart.yml` does it, and for the same reason.
      #
      # Deliberately after the dry run, so resolution and validation stay
      # anonymous: pub.dev can legitimately reject this package-scoped upload
      # identity when reading unrelated dependencies.
      - name: Authenticate to pub.dev
        if: steps.published.outputs.skip == 'false'
        run: |
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          [ -n "$PUB_TOKEN" ] && [ "$PUB_TOKEN" != "null" ] || {
            echo "::error::could not mint the pub.dev OIDC token"
            exit 1
          }
          echo "::add-mask::$PUB_TOKEN"
          echo "PUB_TOKEN=$PUB_TOKEN" >> "$GITHUB_ENV"
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        # The immediately preceding anonymous dry run already performed
        # validation and resolution. Avoid repeating those reads with the
        # package-scoped upload credential attached.
        run: dart pub publish --force --skip-validation

      # The compatibility table's rows ARE the engine lines that ever shipped a
      # wire client, which it reads off this package. A new line appears there
      # only once this upload lands, so this is the other half of the
      # announcement `publish-dart.yml` sends; see the note there about why the
      # App token is not optional.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.published.outputs.skip == 'false'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Announce the release
        if: steps.published.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n --arg version "${GITHUB_REF_NAME#eigen_api-v}" \
            '{event_type: "dart-package-released", client_payload: {package: "eigen_api", version: $version}}' \
            | gh api "repos/$GITHUB_REPOSITORY/dispatches" --input -
