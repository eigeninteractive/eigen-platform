name: Publish eigen_firebase

on:
  push:
    tags: ["eigen_firebase-v*"]

concurrency:
  group: publish-eigen-firebase
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter/.fvmrc
          channel: stable
          cache: true

      - name: Verify tag and package version
        run: |
          tag="${GITHUB_REF_NAME#eigen_firebase-v}"
          package=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          [ "$tag" = "$package" ] || {
            echo "::error::tag eigen_firebase-v$tag does not match pubspec version $package"
            exit 1
          }

      # The workspace root is present in this checkout, so this resolves the
      # local siblings rather than the published ones. That is a deliberate
      # narrowing of what this step used to prove: before the workspace it
      # resolved every declared range from pub.dev, which also happened to
      # assert that a dependency of this package was already published.
      #
      # Nothing replaces that assertion until the consolidated publisher lands,
      # which guarantees it structurally by publishing in dependency order
      # within one job. Until then a package can publish minutes before a
      # sibling it names. The override assertions below still stand: a stray
      # override file would still be wrong, it is just no longer how the
      # siblings are found.
      - name: Resolve dependencies
        run: |
          [ ! -e pubspec_overrides.yaml ] || {
            echo "::error::pubspec_overrides.yaml must not exist in a release checkout"
            exit 1
          }
          grep -q '^dependency_overrides:' pubspec.yaml && {
            echo "::error::dependency_overrides must not appear in pubspec.yaml"
            exit 1
          }
          flutter pub get

      - name: Check Firebase adapter
        run: |
          dart format --output=none --set-exit-if-changed lib test bin
          flutter analyze
          dart doc --dry-run .
          flutter test

      - name: Check whether the version is already published
        id: published
        run: |
          v=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          if curl -sf --retry 3 https://pub.dev/api/packages/eigen_firebase \
               | jq -e --arg v "$v" '.versions[] | select(.version == $v)' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::eigen_firebase $v is already published."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to pub.dev
        if: steps.published.outputs.skip == 'false'
        run: |
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          [ -n "$PUB_TOKEN" ] && [ "$PUB_TOKEN" != "null" ] || {
            echo "::error::could not mint the pub.dev OIDC token"
            exit 1
          }
          echo "::add-mask::$PUB_TOKEN"
          echo "PUB_TOKEN=$PUB_TOKEN" >> "$GITHUB_ENV"
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Publish dry run
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --dry-run

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: dart pub publish --force
