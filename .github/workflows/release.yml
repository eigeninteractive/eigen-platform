name: Release npm packages

# Changesets owns the five npm packages under server/. A push to main either
# refreshes the version PR, publishes an already-versioned release, or exits.
# The exact whole-platform gate is rerun on the commit that would ship.
on:
  push:
    branches: [main]

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions: {}

jobs:
  # Decide whether this push has release work before spending ten minutes on
  # the platform gate. Version and cleanup pull requests receive their own
  # protected PR gate; only an irreversible registry upload gates this main
  # commit again.
  plan:
    name: Detect release work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changesets: ${{ steps.release.outputs.has_changesets }}
      publish: ${{ steps.release.outputs.publish }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc

      - name: Compare release state with npm
        id: release
        run: |
          has_changesets=false
          publish=false

          if find server/.changeset -maxdepth 1 -type f -name '*.md' \
               ! -name README.md -print -quit | grep -q .; then
            has_changesets=true
            echo "::notice::Pending Changesets will be handled by a protected version or cleanup pull request."
          else
            while IFS=$'\t' read -r name version; do
              if result=$(npm view "$name@$version" version --json 2>&1); then
                echo "::notice::$name@$version is already published."
              elif grep -q 'E404' <<<"$result"; then
                echo "::notice::$name@$version is not published."
                publish=true
              else
                echo "::error::Could not query $name@$version on npm."
                echo "$result"
                exit 1
              fi
            done < <(node <<'NODE'
            const { readFileSync } = require('node:fs');
            const manifests = [
              'server/packages/rules/package.json',
              'server/packages/kernel/package.json',
              'server/packages/server/package.json',
              'server/packages/testkit/package.json',
              'server/packages/create-eigen-game/package.json',
            ];
            for (const manifest of manifests) {
              const { name, version } = JSON.parse(readFileSync(manifest, 'utf8'));
              process.stdout.write(`${name}\t${version}\n`);
            }
            NODE
            )
          fi

          echo "has_changesets=$has_changesets" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  gate:
    name: Checks
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  version:
    name: Open or update the version pull request
    needs: plan
    if: needs.plan.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Stable v1.9.0 is the current executable release with `cwd` support and
      # first-class OIDC detection. The v2.0.0 sub-actions do not support cwd;
      # the post-v2 source fix has not published its compiled dist files yet.
      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm version-packages
          title: "Release: version npm packages"
          commit: "Version npm packages"
          commitMode: github-api

      # Changesets intentionally commits only files under its `cwd`. Our
      # version script also regenerates platform.json and web references, so
      # carry that reviewed cross-workspace diff onto the same release branch.
      - name: Complete the version pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          patch="$RUNNER_TEMP/platform-version.patch"
          git diff --binary -- platform.json web > "$patch"
          [ -s "$patch" ] || {
            echo "::error::Versioning produced no root or documentation diff."
            exit 1
          }

          git restore --source=HEAD --staged --worktree .
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$remote" changeset-release/main
          git switch --force-create changeset-release/main FETCH_HEAD
          git apply "$patch"

          node tool/platform.mjs --check
          pnpm --dir web check-docs-version

          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"
          git add platform.json web
          git commit -m "Regenerate platform release references"
          git push "$remote" HEAD:changeset-release/main

      # The stable action intentionally declines to open a PR when every
      # pending Changeset is empty. Consume those markers in the same protected
      # release branch so they cannot permanently block future detection.
      - name: Open a cleanup pull request for empty Changesets
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.pullRequestNumber == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pnpm --dir server changeset version
          git diff --quiet -- server/.changeset && {
            echo "::error::Changesets reported pending files but produced no cleanup diff."
            exit 1
          }

          branch="changeset-release/main"
          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add server/.changeset
          git commit -m "Consume empty Changesets"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Release: consume empty Changesets" \
              --body "Removes internal-only Changeset markers without changing any package version. Merging lets registry publication detection resume."
          fi

  publish:
    name: Publish to npm
    needs: [plan, gate]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      # Do not set registry-url. npm trusted publishing exchanges this job's
      # OIDC identity; an npmrc token placeholder can mask that exchange.
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: server
        run: pnpm -r build

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          publish: pnpm changeset publish
          commitMode: github-api

      # pub.dev accepts a trusted-publishing identity only from the package's
      # configured tag pattern, so eigen_api publishes in a separate workflow.
      # Ensure the tag directly instead of depending on changesets/action's
      # `published` output: its no-pending-Changesets recovery path publishes
      # missing versions but does not populate that output.
      - name: Ensure eigen_api tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          v=$(awk '/^version:/ { print $2; exit }' server/clients/dart/pubspec.yaml)
          tag="eigen_api-v$v"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          server_v=$(node -p "require('./server/packages/server/package.json').version")
          [ "$v" = "$server_v" ] || {
            echo "::error::eigen_api $v does not match @eigeninteractive/server $server_v"
            exit 1
          }

          if git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists."
            exit 0
          fi

          npm view "@eigeninteractive/server@$server_v" version --json >/dev/null || {
            echo "::error::@eigeninteractive/server@$server_v is not published; refusing to tag eigen_api."
            exit 1
          }

          git tag "$tag"
          git push "$remote" "$tag"
