name: Release npm packages

# Changesets owns the five npm packages under server/. A push to main refreshes
# the version PR or exits. A successful Platform checks run on main starts this
# workflow again through workflow_run and publishes from that run's exact commit.
#
# Publication deliberately is not a reusable-workflow call from checks.yml. npm
# trusted publishing validates the calling workflow's filename in that case,
# which would make the registry identity `checks.yml` instead of this dedicated
# `release.yml` boundary.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Platform checks]
    types: [completed]
    branches: [main]

concurrency:
  group: release-npm-${{ github.event_name == 'workflow_run' && 'publish' || 'version' }}
  cancel-in-progress: false

permissions: {}

jobs:
  # On a push, decide whether Changesets needs to maintain a version or cleanup
  # pull request while Platform checks runs independently. On workflow_run,
  # repeat the cheap registry comparison at the exact commit that just passed
  # that gate and publish only versions that are still missing.
  plan:
    name: Detect release work
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changesets: ${{ steps.release.outputs.has_changesets }}
      publish: ${{ steps.release.outputs.publish }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc

      - name: Compare release state with npm
        id: release
        run: |
          has_changesets=false
          publish=false

          if find server/.changeset -maxdepth 1 -type f -name '*.md' \
               ! -name README.md -print -quit | grep -q .; then
            has_changesets=true
            echo "::notice::Pending Changesets will be handled by a protected version or cleanup pull request."
          else
            for manifest in \
              server/packages/rules/package.json \
              server/packages/kernel/package.json \
              server/packages/server/package.json \
              server/packages/testkit/package.json \
              server/packages/create-eigen-game/package.json; do
              IFS=$'\t' read -r name version \
                < <(jq -r '[.name, .version] | @tsv' "$manifest")
              if result=$(npm view "$name@$version" version --json 2>&1); then
                echo "::notice::$name@$version is already published."
              elif grep -q 'E404' <<<"$result"; then
                echo "::notice::$name@$version is not published."
                publish=true
              else
                echo "::error::Could not query $name@$version on npm."
                echo "$result"
                exit 1
              fi
            done
          fi

          echo "has_changesets=$has_changesets" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  version:
    name: Open or update the version pull request
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # v2.0.0 removed `cwd`; v2.1.0 put it back ("This input existed in v1 but
      # was incorrectly removed"), which is what makes v2 usable here at all --
      # this repository's Changesets config lives in `server/`, not the root.
      #
      # v2 also renamed every input, and a version bump alone would not have said
      # so: unknown `with:` keys are a warning, not an error, so `version:` and
      # `publish:` would have been ignored and both jobs would have run their
      # default behaviour while reporting success.
      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          pr-title: "Release: version npm packages"
          commit-message: "Version npm packages"
          # `commitMode: github-api` is gone; the GitHub API is now the default
          # and `push-with-git-cli: true` opts out of it. Left at the default
          # deliberately: API commits are signed with GitHub's key and attributed
          # to the release App that owns the token.

      # The outputs were renamed to kebab-case too, and a hyphenated name cannot
      # be dereferenced with dot syntax -- `outputs.pr-number` parses as
      # subtraction rather than as a property. Read both once here through the
      # index operator into names the steps below can use normally.
      #
      # The notice is not decoration. Reading these wrongly is the one mistake in
      # this workflow that produces no error and no visible symptom, so the values
      # the branches below turn on are printed where the next release will show
      # them.
      - name: Read the version pull request state
        id: version_pr
        env:
          PR_NUMBER: ${{ steps.changesets.outputs['pr-number'] }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs['has-changesets'] }}
        run: |
          echo "::notice::changesets reported pr-number='$PR_NUMBER' has-changesets='$HAS_CHANGESETS'"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "has_changesets=$HAS_CHANGESETS" >> "$GITHUB_OUTPUT"

      # There used to be a step here that carried `platform.json` and the `web`
      # references onto the release branch by hand -- capture `git diff`, switch
      # branches, `git apply`, commit, push -- because Changesets was believed to
      # commit only files under its `cwd`.
      #
      # It is deleted, and reading the action's source is what nearly kept it:
      # `pushChanges` does pass `cwd` on both paths, which looks conclusive. It is
      # not. On the GitHub API path `cwd` only locates the repository for
      # `commitChangesSinceBase`, which then diffs the whole worktree against the
      # base commit. Measured on the first v2.1.0 run: commit fc83bb8 on
      # `changeset-release/main` carries 56 files, including `platform.json`, both
      # `openapi.json` copies and the entire generated HTTP reference. The version
      # PR is complete in one commit now.
      #
      # Keeping the step would not merely have been redundant, it failed: it
      # applies a diff the commit already contains, so the second version run for
      # any pending Changeset died on `patch does not apply`. That is not a rare
      # case -- every push to `main` while a Changeset is pending re-runs this job.
      #
      # The two assertions it also ran, `platform.mjs --check` and
      # `check-docs-version`, are not lost: the version PR runs the full platform
      # gate, which is where both already live. That is the better place for the
      # docs-line decision in particular -- a red `web` shard on a complete,
      # reviewable PR, rather than a half-built release branch.

      # v1 declined to open a PR when every pending Changeset was empty, leaving
      # markers that would block registry detection forever; this consumes them on
      # the same protected release branch. Whether v2 still declines is not
      # verified -- it cannot be, short of a release with only empty markers
      # pending -- and it does not need to be: this condition and the one above
      # are complements, so if v2 opens a PR instead, the completion step handles
      # it and this one simply does not run.
      - name: Open a cleanup pull request for empty Changesets
        if: steps.version_pr.outputs.has_changesets == 'true' && steps.version_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pnpm --dir server changeset version
          git diff --quiet -- server/.changeset && {
            echo "::error::Changesets reported pending files but produced no cleanup diff."
            exit 1
          }

          branch="changeset-release/main"
          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add server/.changeset
          git commit -m "Consume empty Changesets"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Release: consume empty Changesets" \
              --body "Removes internal-only Changeset markers without changing any package version. Merging lets registry publication detection resume."
          fi

  publish:
    name: Publish to npm
    needs: plan
    if: github.event_name == 'workflow_run' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      # Do not set registry-url. npm trusted publishing exchanges this job's
      # OIDC identity; an npmrc token placeholder can mask that exchange.
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: server
        run: pnpm -r build

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm changeset publish

      # pub.dev accepts a trusted-publishing identity only from the package's
      # configured tag pattern, so eigen_api publishes in a separate workflow.
      # Ensure the tag directly instead of depending on changesets/action's
      # `published` output: its no-pending-Changesets recovery path publishes
      # missing versions but does not populate that output.
      - name: Ensure eigen_api tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          v=$(awk '/^version:/ { print $2; exit }' server/clients/dart/pubspec.yaml)
          tag="eigen_api-v$v"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          server_v=$(node -p "require('./server/packages/server/package.json').version")
          [ "$v" = "$server_v" ] || {
            echo "::error::eigen_api $v does not match @eigeninteractive/server $server_v"
            exit 1
          }

          if git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists."
            exit 0
          fi

          # Poll rather than ask once. This guard runs seconds after the publish
          # step wrote to the same registry, and npm's read path is eventually
          # consistent: the 0.5.0 and 0.5.1 releases both failed here with E404
          # on a version that was already live, and both needed a manual rerun.
          # The check is still a real gate -- it refuses to tag a version npm
          # never accepted -- it just stops treating propagation lag as that.
          published=false
          for attempt in $(seq 1 12); do
            if npm view "@eigeninteractive/server@$server_v" version --json >/dev/null 2>&1; then
              published=true
              break
            fi
            echo "::notice::npm has not surfaced @eigeninteractive/server@$server_v yet (attempt $attempt/12); waiting 10s."
            sleep 10
          done

          if [ "$published" != "true" ]; then
            echo "::error::@eigeninteractive/server@$server_v is not published after two minutes; refusing to tag eigen_api."
            exit 1
          fi

          git tag "$tag"
          git push "$remote" "$tag"
