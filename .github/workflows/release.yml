name: Release npm packages

# Changesets owns the five npm packages under server/. A push to main either
# refreshes the version PR, publishes an already-versioned release, or exits.
# The exact whole-platform gate is rerun on the commit that would ship.
on:
  push:
    branches: [main]

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  version:
    name: Open or update the version pull request
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Stable v1.9.0 is the current executable release with `cwd` support and
      # first-class OIDC detection. The v2.0.0 sub-actions do not support cwd;
      # the post-v2 source fix has not published its compiled dist files yet.
      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm version-packages
          title: "Release: version npm packages"
          commit: "Version npm packages"
          commitMode: github-api

      # The stable action intentionally declines to open a PR when every
      # pending Changeset is empty. Consume those markers in the same protected
      # release branch so they cannot permanently block future detection.
      - name: Open a cleanup pull request for empty Changesets
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.pullRequestNumber == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pnpm --dir server changeset version
          git diff --quiet -- server/.changeset && {
            echo "::error::Changesets reported pending files but produced no cleanup diff."
            exit 1
          }

          branch="changeset-release/main"
          git config user.name "eigen-release[bot]"
          git config user.email "eigen-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add server/.changeset
          git commit -m "Consume empty Changesets"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Release: consume empty Changesets" \
              --body "Removes internal-only Changeset markers without changing any package version. Merging lets registry publication detection resume."
          fi

  detect-publish:
    name: Detect unpublished versions
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc

      # Exact-version lookups make retries and partially completed releases
      # safe: Changesets publishes only the local versions npm does not have.
      - name: Compare package versions with npm
        id: registry
        run: |
          publish=false
          while IFS=$'\t' read -r name version; do
            if result=$(npm view "$name@$version" version --json 2>&1); then
              echo "::notice::$name@$version is already published."
            elif grep -q 'E404' <<<"$result"; then
              echo "::notice::$name@$version is not published."
              publish=true
            else
              echo "::error::Could not query $name@$version on npm."
              echo "$result"
              exit 1
            fi
          done < <(node <<'NODE'
          const { readFileSync } = require('node:fs');
          const manifests = [
            'server/packages/rules/package.json',
            'server/packages/kernel/package.json',
            'server/packages/server/package.json',
            'server/packages/testkit/package.json',
            'server/packages/create-eigen-game/package.json',
          ];
          for (const manifest of manifests) {
            const { name, version } = JSON.parse(readFileSync(manifest, 'utf8'));
            process.stdout.write(`${name}\t${version}\n`);
          }
          NODE
          )
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: detect-publish
    if: needs.detect-publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      # Do not set registry-url. npm trusted publishing exchanges this job's
      # OIDC identity; an npmrc token placeholder can mask that exchange.
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.nvmrc
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: server
        run: pnpm -r build

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: server
          github-token: ${{ steps.app-token.outputs.token }}
          publish: pnpm changeset publish
          commitMode: github-api

      - name: Detect an engine release
        id: engine
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          if jq -e '.[] | select(.name == "@eigeninteractive/server")' <<<"$PACKAGES" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only independent packages published; eigen_api is unchanged."
          fi

      # pub.dev accepts a trusted-publishing identity only from the package's
      # configured tag pattern, so eigen_api publishes in a separate workflow.
      - name: Tag eigen_api
        if: steps.engine.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          v=$(awk '/^version:/ { print $2; exit }' server/clients/dart/pubspec.yaml)
          tag="eigen_api-v$v"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists."
            exit 0
          fi

          git tag "$tag"
          git push "$remote" "$tag"
