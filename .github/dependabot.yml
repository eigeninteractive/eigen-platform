version: 2

# Component dependencies are released deliberately through Changesets and the
# Dart package changelog. Keep the CI actions current without mixing automated
# dependency releases into those workflows.
#
# TypeScript majors are held back in both npm ecosystems below, and the two halves
# are held for different reasons.
#
# `/web` is genuinely blocked. `typedoc` peers at `<=6.0.x` and 0.28.20 is its
# latest stable; the only newer publishes are 1.0.0-dev prereleases, and
# `typedoc-plugin-markdown` -- which is what actually generates the TypeScript
# reference -- peers at `typedoc: 0.28.x` exactly, so it could not follow even if
# the prerelease were acceptable in a docs build.
#
# `/server` is not blocked. Its `tsdown` build uses rolldown-plugin-dts, which
# supports TypeScript 6 and selects the native TypeScript 7 declaration generator
# when TS 7 is installed. It is held only to keep one TypeScript version across
# the repository while `/web` is pinned, which is a preference and can be dropped
# whenever that stops being worth it.
#
# Either way the hold matters because each group's pattern is `*`: one unadopted
# major fails the whole grouped PR, and a dozen ordinary updates stop landing with
# it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    # See the header: nothing blocks 7 here; held to match `/web`.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Zod's JSON Schema serializer is part of the checked-in TypeScript/Dart
      # wire contract. Upgrade it deliberately with regenerated contracts and
      # cross-language generator coverage, not inside a grouped maintenance PR.
      - dependency-name: zod
      # The Cloudflare Workers pool currently supports Vitest 4.1 and relies on
      # Vitest internals. Vitest 5 prevents every Worker test from starting.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      server-dependencies:
        patterns: ["*"]
        exclude-patterns: ["zod", "vitest"]
    commit-message:
      prefix: "deps(server)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    # See the header: `typedoc` and its markdown plugin both cap at 6.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # This package renders the committed TypeScript API reference. Its
      # upgrades must include and review the regenerated Markdown.
      - dependency-name: typedoc-plugin-markdown
    groups:
      documentation-dependencies:
        patterns: ["*"]
        exclude-patterns: ["typedoc-plugin-markdown"]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: monthly
    # Dependabot's Pub updater normalizes the whole manifest while updating an
    # unrelated package. It currently rewrites our exact Freezed pin to a
    # release requiring Dart 3.13 even though the supported Flutter baseline
    # ships Dart 3.12, and widens other deliberately bounded constraints.
    # Disable routine Pub version PRs until the baseline moves; Dependabot
    # security updates are independent of this limit.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(flutter)"

  - package-ecosystem: pub
    directory: /server/clients/dart
    schedule:
      interval: monthly
    groups:
      generated-client-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(eigen_api)"
