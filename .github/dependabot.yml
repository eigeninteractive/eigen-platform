version: 2

# Component dependencies are released deliberately through Changesets and the
# Dart package changelog. Keep the CI actions current without mixing automated
# dependency releases into those workflows.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    groups:
      server-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(server)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      documentation-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: monthly
    groups:
      flutter-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(flutter)"

  - package-ecosystem: pub
    directory: /server/clients/dart
    schedule:
      interval: monthly
    groups:
      generated-client-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(eigen_api)"
