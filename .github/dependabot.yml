version: 2

# Component dependencies are released deliberately through Changesets and the
# Dart package changelog. Keep the CI actions current without mixing automated
# dependency releases into those workflows.
#
# TypeScript majors are held back in both npm ecosystems below, and the two halves
# are held for different reasons.
#
# `/web` is genuinely blocked. `typedoc` peers at `<=6.0.x` and 0.28.20 is its
# latest stable; the only newer publishes are 1.0.0-dev prereleases, and
# `typedoc-plugin-markdown` -- which is what actually generates the TypeScript
# reference -- peers at `typedoc: 0.28.x` exactly, so it could not follow even if
# the prerelease were acceptable in a docs build.
#
# `/server` is not blocked. Its `tsdown` build uses rolldown-plugin-dts, which
# supports TypeScript 6 and selects the native TypeScript 7 declaration generator
# when TS 7 is installed. It is held only to keep one TypeScript version across
# the repository while `/web` is pinned, which is a preference and can be dropped
# whenever that stops being worth it.
#
# Routine minor and patch updates are grouped to keep maintenance cheap. Major
# updates stay in focused pull requests so an incompatible upgrade cannot block
# unrelated maintenance or obscure the cause of a failing check.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    # See the header: nothing blocks 7 here; held to match `/web`.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # The Workers Vitest plugin relies on Vitest internals and peers on its
      # major, and the coverage provider is versioned in lockstep with Vitest,
      # so the three move in one pull request, majors included.
      test-runner:
        patterns: ["vitest", "@vitest/*", "@cloudflare/vitest-plugin"]
      # Zod's JSON Schema serializer is part of the checked-in TypeScript/Dart
      # wire contract. Upgrade it deliberately with regenerated contracts and
      # cross-language generator coverage, so it stays out of this group.
      server-dependencies:
        patterns: ["*"]
        exclude-patterns: ["zod", "vitest", "@vitest/*", "@cloudflare/vitest-plugin"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(server)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    # See the header: `typedoc` and its markdown plugin both cap at 6.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      documentation-dependencies:
        patterns: ["*"]
        # This package renders the committed TypeScript API reference. Keep its
        # upgrades isolated so the regenerated Markdown can be reviewed.
        exclude-patterns: ["typedoc-plugin-markdown"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(web)"

  # The seven Dart packages resolve as one pub workspace (root `pubspec.yaml`),
  # and pub only computes upgrades from the root of a resolution: an entry per
  # member fails every run with "Only apply dependency_services to the root of
  # the workspace." One entry here covers every member's pubspec and the shared
  # `pubspec.lock`.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    groups:
      dart-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(dart)"

  - package-ecosystem: gradle
    directory: /firebase/android
    schedule:
      interval: monthly
    groups:
      firebase-android-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(eigen_firebase_android)"
