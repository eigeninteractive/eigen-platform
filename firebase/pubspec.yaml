name: eigen_firebase
description: Optional Firebase authentication, telemetry, crash reporting, and push adapters for EigenInteractive Flutter apps.
version: 0.1.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/firebase
documentation: https://eigeninteractive.com/docs/reference/dart
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_flutter: ^0.8.0
  firebase_analytics: ^12.4.1
  firebase_app_installations: ^0.4.2+6
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  path: ^1.9.1
  shared_preferences: ^2.5.4

dev_dependencies:
  checks: ^0.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.eigeninteractive.eigen_firebase
        pluginClass: EigenFirebasePlugin
