name: eigen_firebase
description: Optional Firebase authentication, telemetry, crash reporting, and push adapters for EigenInteractive Flutter apps.
version: 0.4.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/firebase
documentation: https://eigeninteractive.com/docs/reference/dart
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/tree/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_firebase-v%version%

# Resolved as part of the workspace at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  eigen_flutter: ^0.13.0
  firebase_analytics: ^12.4.1
  firebase_app_installations: ^0.4.2+6
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  path: ^1.9.1
  shared_preferences: ^2.5.4

dev_dependencies:
  checks: ^0.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.eigeninteractive.eigen_firebase
        pluginClass: EigenFirebasePlugin
