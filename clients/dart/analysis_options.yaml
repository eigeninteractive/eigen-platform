# This package is 100% generated. Analysis here is a COMPILE CHECK, not a style
# gate: it exists to catch the generator emitting Dart that does not typecheck
# — which has happened (an undefined-class reference slipped through once). It
# does not hold generated code to the engine's lint standards.
#
# The two relaxations are for output the dart-dio + json_serializable templates
# produce and that we cannot fix, because the next generation overwrites any
# edit. Suppressing them here rather than with CI flags also keeps a clean
# pub.dev analysis score, which pana grades on this same file.
analyzer:
  errors:
    # Every api file imports ErrorResponse whether its operations use it or not.
    unused_import: ignore
    # json_serializable emits `as List` casts the analyzer judges redundant.
    unnecessary_cast: ignore
