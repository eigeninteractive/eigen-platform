name: eigen_api
description: >-
  Generated dart-dio REST client for the EigenInteractive game engine. Its lib/ sources are
  regenerated wholesale from openapi.json by scripts/generate-dart-client.sh;
  THIS manifest is hand-owned and the generator is told to skip it (see
  .openapi-generator-ignore).
#
# Why owned (beyond the version-stamping below): the dart-dio template stamps
# `environment.sdk: '>=3.5.0 <4.0.0'`, but the `.g.dart` that json_serializable
# emits uses the Dart 3.8 `null-aware-elements` feature (verified: those files
# fail to analyze below 3.8) so the real floor is ^3.8.0. json_serializable
# emits that syntax regardless of the declared lower bound, so lowering it only
# breaks generation. Relax to match once the template stamps a 3.8 bound itself.
#
# `version:` is stamped by the generation script from @eigeninteractive/server's
# package.json. The wire contract is the server's, so the client carries the
# server's version. Do not edit it by hand.
version: 0.3.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-server
issue_tracker: https://github.com/eigeninteractive/eigen-server/issues
documentation: https://eigeninteractive.com/docs/reference/http-surface
topics:
  - games
  - multiplayer
  - api-client

environment:
  sdk: ^3.8.0
dependencies:
  dio: ^5.10.0
  json_annotation: ^4.12.0
dev_dependencies:
  build_runner: ^2.15.2
  json_serializable: ^6.14.0
