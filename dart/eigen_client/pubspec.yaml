name: eigen_client
description: Pure Dart client, domain, and live-session coordination for EigenInteractive games.
version: 0.6.0
homepage: https://eigeninteractive.com
repository: https://github.com/eigeninteractive/eigen-platform/tree/main/dart/eigen_client
documentation: https://eigeninteractive.com/docs/reference/dart
issue_tracker: https://github.com/eigeninteractive/eigen-platform/issues

cider:
  link_template:
    tag: https://github.com/eigeninteractive/eigen-platform/tree/%tag%
    diff: https://github.com/eigeninteractive/eigen-platform/compare/%from%...%to%
    version: eigen_client-v%version%

# Resolved as part of the workspace at the repository root.
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.10.0
  drift: ^2.35.0
  eigen_api: ^0.10.0
  json_annotation: ^4.12.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.15.0
  checks: ^0.3.1
  drift_dev: ^2.35.0
  lints: ^6.0.0
  test: ^1.29.0
